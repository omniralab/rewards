[package]
name = "omnira-rewards"
version = "0.1.0"
description = "Omnira Rewards - USDC shift bonus escrow on Solana"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "omnira_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# ~1.1.2 = ta sama linia co anchor-cli; 1.2.x zmienia narzędzia budowania.
anchor-lang = { version = "~1.1.2", features = ["init-if-needed"] }
anchor-spl = "~1.1.2"

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
# examples/devnet.rs
solana-rpc-client = "3.1"
solana-commitment-config = "3"
spl-token-interface = "2"
spl-associated-token-account-interface = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
